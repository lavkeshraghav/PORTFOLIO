  </defs>

  <!-- Outer Circle -->
  <circle cx="120" cy="120" r="105" fill="url(#g)" opacity="0.15"/>
  <circle cx="120" cy="120" r="85" fill="none" stroke="#38bdf8" stroke-width="4"/>

